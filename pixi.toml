[workspace]
name = "reqadence"
authors = [
    "Durrant Lab <durrantj@pitt.edu>",
]
channels = ["conda-forge"]
description = "Async foundation for REST API clients with retries, rate limiting, and response caching."
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
license = "Apache-2.0"
readme = "README.md"

[pypi-dependencies]
reqadence = { path = ".", editable = true }

[environments]
dev = ["dev"]
docs = ["docs"]

[tasks]

[dependencies]
python = ">=3.12,<3.15"
httpx = ">=0.28.1,<0.29"
aiolimiter = ">=1.2.1,<2"
hishel = ">=1.3.1,<2"
loguru = ">=0.7.3,<0.8"

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
coverage = ">=7.15.4,<8"
pytest-html = ">=4.2.0,<5"
colorama = ">=0.4.6,<0.5"
basedpyright = ">=1.39.8,<2"
ruff = ">=0.16.2,<0.17"
twine = ">=7.0.0,<8"

[feature.dev.tasks]
format = "ruff check --select I --fix --config .ruff.toml && ruff format --config .ruff.toml ./"
typecheck = "basedpyright reqadence"
tests = "PYTHONPATH=. pytest -c .pytest.ini --cov=reqadence --cov-report=xml --junit-xml=report.xml --failed-first"
coverage = { cmd = ["coverage", "report"] }
cleanup-build = { cmd = ["rm", "-rf", "./build"] }
build = { cmd = ["python3", "-m", "build"], depends-on = ["cleanup-build"]}
publish-test = { cmd = ["twine", "upload", "--repository", "testpypi", "dist/*"] }
publish = { cmd = ["twine", "upload", "dist/*"] }

[feature.dev.pypi-dependencies]
build = ">=1.5.0, <2"
mypy-extensions = "*"
setuptools-scm = ">=10.2.1, <11"

[feature.docs.dependencies]
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.7,<10"
mkdocstrings = ">=1.0.6,<2"
mkdocstrings-python = ">=2.0.5,<3"
pymdown-extensions = ">=11.0.1,<12"
mkdocs-table-reader-plugin = ">=3.1.0,<4"
mkdocs-gen-files = ">=0.6.1,<0.7"
mkdocs-macros-plugin = ">=1.5.0,<2"
mkdocs-jupyter = ">=0.25.1,<0.26"
mkdocs-glightbox = ">=0.5.2,<0.6"
mkdocs-git-revision-date-localized-plugin = ">=1.2.9,<2"

[feature.docs.pypi-dependencies]
material-plausible-plugin = ">=0.3.0, <0.4"
mkdocs-print-site-plugin = ">=2.8, <3"
mkdocs-awesome-nav = ">=3.3.0, <4"

[feature.docs.tasks]
docs = "rm -rf ./public/ && mkdocs build -d public/"
serve = { cmd = ["mkdocs", "serve"] }
