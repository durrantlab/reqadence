[workspace]
name = "reqadence"
authors = ["Durrant Lab <durrantj@pitt.edu>"]
channels = ["conda-forge"]
description = "Async foundation for REST API clients with retries, rate limiting, and response caching."
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
license = "Apache-2.0"
readme = "README.md"
requires-pixi = ">=0.59"

[dependencies]
python = ">=3.12"

[pypi-dependencies]
reqadence = { path = ".", editable = true }

[environments]
default = ["test", "lint", "build"]
py312 = ["test", "py312"]
py313 = ["test", "py313"]
py314 = ["test", "py314"]
py315 = ["test", "py315"]
lowest = { features = ["test", "py312"], solve-strategy = "lowest-direct" }
docs = ["docs"]

[feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-asyncio = ">=1.4.0,<2"
pytest-cov = ">=7.1.0,<8"
coverage = ">=7.15.4,<8"

[feature.test.tasks]
tests = "pytest -c .pytest.ini --cov=reqadence --cov-report=xml --junit-xml=report.xml --failed-first"
coverage = "coverage report"

[feature.lint.dependencies]
ruff = ">=0.16.2,<0.17"

[feature.lint.pypi-dependencies]
ty = ">=0.0.109,<0.1"

[feature.lint.tasks]
format = "ruff check --select I --fix --config .ruff.toml . && ruff format --config .ruff.toml ."
lint = "ruff check --config .ruff.toml . && ruff format --check --config .ruff.toml ."
typecheck = "ty check reqadence"

[feature.build.dependencies]
python-build = ">=1.5.0,<2"
twine = ">=7.0.0,<8"

[feature.build.tasks]
build = "rm -rf build dist && python -m build"
check-dist = { cmd = "twine check --strict dist/*", depends-on = ["build"] }
publish-test = { cmd = "twine upload --repository testpypi dist/*", depends-on = ["check-dist"] }
publish = { cmd = "twine upload dist/*", depends-on = ["check-dist"] }

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"

[feature.docs.dependencies]
zensical = ">=0.1.3,<0.2"
mkdocstrings-python = ">=2.0.5,<3"

[feature.docs.tasks]
docs = "zensical build --clean"
serve = "zensical serve"
