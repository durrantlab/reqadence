[project]
name = "reqadence"
description = "Async foundation for REST API clients with retries, rate limiting, and response caching."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
    {name = "Mayar Ahmed", email = "mma121@pitt.edu"},
    {name = "Jacob D. Durrant", email = "durrantj@pitt.edu"},
]
maintainers = [
    {name = "Durrant Lab", email = "durrantj@pitt.edu"},
]
keywords = ["async", "httpx", "rest", "api", "rate-limiting", "retry", "cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dynamic = ["version"]

dependencies = [
    "httpx>=0.28,<1.0",
    "aiolimiter>=1.2,<2.0",
    "hishel>=1.3,<2.0",
    "loguru>=0.7.3,<1.0.0",
]

[project.urls]
Repository = "https://github.com/durrantlab/reqadence"
Issues = "https://github.com/durrantlab/reqadence/issues"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["reqadence*"]

[tool.setuptools_scm]
version_file = "reqadence/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-timestamp"

[tool.basedpyright]
typeCheckingMode = "standard"