[project]
name = "reqadence"
description = "Async foundation for REST API clients with retries, rate limiting, and response caching."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.md", "THIRD_PARTY_LICENSES.md"]
authors = [
    { name = "Mayar Ahmed", email = "mma121@pitt.edu" },
    { name = "Jacob D. Durrant", email = "durrantj@pitt.edu" },
]
maintainers = [{ name = "Durrant Lab", email = "durrantj@pitt.edu" }]
keywords = ["async", "httpx", "rest", "api", "rate-limiting", "retry", "cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]

dependencies = [
    "httpx>=0.28.1,<1.0",
    "aiolimiter>=1.2,<2.0",
    "hishel[httpx]>=1.3,<2.0",
    "loguru>=0.7.3,<1.0.0",
    "pydantic>=2.13,<3.0",
]

[project.urls]
Documentation = "https://durrantlab.github.io/reqadence/"
Repository = "https://github.com/durrantlab/reqadence"
Issues = "https://github.com/durrantlab/reqadence/issues"
Changelog = "https://github.com/durrantlab/reqadence/blob/main/CHANGELOG.md"

[build-system]
# setuptools 77 is the first release with PEP 639 `license`/`license-files`.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["reqadence*"]

[tool.setuptools_scm]
version_file = "reqadence/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-timestamp"

[tool.setuptools.package-data]
"reqadence" = ["py.typed"]
